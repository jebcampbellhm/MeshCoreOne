name: LoRa OTA validation

on:
  push:
    branches: [lora-ota]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lora-ota-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          repository: mikecarper/MeshCore
          ref: 656cb6924f01acaa1285c75aa3eda1e0151bcb80
          path: reference-meshcore
      - uses: actions/checkout@v6
        with:
          repository: mikecarper/motatool
          ref: 5d9646cb08105245fb96c28450669c58763224bb
          path: reference-motatool
      - name: Install reference validators
        run: python -m pip install cryptography detools==0.53.0
      - name: Check reproducible packages and Python wire compatibility
        run: |
          python ci/generate_mota_packages.py
          git diff --exit-code -- MeshCore/Tests/MeshCoreTestSupport/Fixtures
          python ci/check_mota_packages.py --repository reference-meshcore
      - name: Verify packages with Rust motatool
        run: cargo run --release --locked --manifest-path reference-motatool/Cargo.toml -- verify MeshCore/Tests/MeshCoreTestSupport/Fixtures/*.mota
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install project tools
        run: brew install xcodegen swiftgen
      - name: Generate project
        run: |
          printf 'settings:\n  base:\n    DEVELOPMENT_TEAM: ""\n' > dev.yml
          xcodegen generate
      - name: Build iOS simulator app
        run: xcodebuild build -project MC1.xcodeproj -scheme MC1 -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
  swift-tests:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: swift --version
      - name: MeshCore tests
        run: swift test --package-path MeshCore --no-parallel
      - name: MC1Services tests
        run: swift test --package-path MC1Services --no-parallel
